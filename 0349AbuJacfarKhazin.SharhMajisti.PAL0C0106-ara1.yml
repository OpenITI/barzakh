90#VERS#COMMENT##: Text digitized by the Ptolemaeus Arabus et Latinus
    project at the Bayerische Akademie der Wissenschaften. Both transliteration
    and photographs are available on the link above.
    Original edition: Richard P. Lorch, ‘Abū Jaʿfar al-Khāzin on Isoperimetry and the Archimedean Tradition’, Zeitschrift für Geschichte der Arabisch-Islamischen Wissenschaften 3 (1986), pp. 150–229.
    References to geometrical figures were originally indicated using
    Unicode U+0305 : COMBINING OVERLINE ; PV removed these overlines and
    put the references between forward slashes (e.g., `/ا ب ج/`).
    Standard Arabic letters are used for the references
    (not the isolated glyphs), separated by spaces.
    The text contains two sets of page numbers:
    * PageV03P...: page numbers of the Lorch edition
    * FolioVpP...: folio numbers of witness P: Paris, BnF ar. 4821
