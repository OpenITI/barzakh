90#VERS#COMMENT##: Badawī edited three early Arabic translations of the
    work;  This is the one by Ibn Zurʿa.  The two others are ascribed to al-
    Nāʿimī and Yaḥyā b. ʿAdī. In Badawī's edition, for each chapter in
    Aristotle's text, the  three translations are given consecutively. The
    Graeco-Arabic project extracted each translation in a separate file.
    The text contains two sets of page numbers:
    * PageV01Pxxx: page numbers of the Badawi edition
    * FolioVpPxxx: folio numbers of witness P: Paris, Bibliothèque Nationale, arabe 2346
