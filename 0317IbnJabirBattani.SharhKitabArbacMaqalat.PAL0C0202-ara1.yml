90#VERS#COMMENT##: This is a transcription of al-Battānī’s commentary
    on Ptolemy’s Tetrabiblos based on manuscript Escorial árabe 969.
    It comments on some chapters of Books I and II
    and on all chapters of Books III and IV.
    Text digitized by Nadine Löhr for the Ptolemaeus Arabus et Latinus
    project at the Bayerische Akademie der Wissenschaften. Both transliteration
    and photographs are available on the link above.
    The text contains two sets of folio numbers:
    * FolioV01P...: manuscript Escorial árabe 969
    * FolioVbP...:  Berlin Sprenger 1840 manuscript
